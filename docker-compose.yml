version: '3.8'

services:
  discord-crypto-vwap-bot:
    build: .
    container_name: discord-crypto-vwap-tool
    env_file: .env
    volumes:
      - ./config.py:/app/config.py
      - bot_data:/app/data
    restart: unless-stopped
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD", "nslookup", "google.com", "1.1.1.1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    tty: true
    stdin_open: true

volumes:
  bot_data: